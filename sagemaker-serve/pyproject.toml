[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemaker-serve"
dynamic = ["version"]
description = "SageMaker Serve package for model serving and deployment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Amazon Web Services"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sagemaker-core>=2.28.0",
    "sagemaker-train>=1.28.0",
    "boto3>=1.42.2,<2.0",
    "botocore>=1.35.75,<2.0",
    "deepdiff",
    "sagemaker_schema_inference_artifacts",
    "tqdm",
    "psutil",
]

# Framework-specific serving backends are optional: the base package must only
# carry what every serving path needs. The code paths that use them import them
# lazily and raise an ImportError naming the extra to install.
[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
onnx = [
    "onnx",
    "onnxruntime",
]
triton = [
    "tritonclient[http]",
    "onnx",
    "onnxruntime",
    "torch>=2.0.0",
]
mlflow = [
    "mlflow",
]
all = [
    "mlflow",
    "onnx",
    "onnxruntime",
    "torch>=2.0.0",
    "tritonclient[http]",
]
test = [
    "pytest",
    "pytest-cov",
    "mock",
    "mlflow",
    "onnx",
    "onnxruntime",
    "torch>=2.0.0",
    "tritonclient[http]",
    # pandas is pulled in transitively (e.g. via mlflow). Cap below 3.1.0:
    # pandas 3.1.0 ships wheels built against a newer NumPy C-ABI than the
    # py311/py312 test envs resolve, so it fails to import ("ImportError:
    # C extension: None not built") at pytest collection time. The previous
    # release 3.0.6 was passing on py311/py312; py310 stays on the 2.x line
    # (2.3.3) because pandas 3.x requires Python >=3.11.
    "pandas>=2.3.0,<3.1.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "mock",
    "black",
    "flake8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sagemaker*"]
namespaces = true

[tool.setuptools.package-data]
"sagemaker.serve" = ["schema/*.json"]

[tool.setuptools.dynamic]
version = { file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow_test: mark a test that is excluded from PR check runs. Long-running or hang-prone tests that would otherwise push the run past the CodeBuild timeout; they run in a dedicated scheduled CI run instead.",
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
