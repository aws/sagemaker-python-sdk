name: SageMaker Core - Merge Botocore Sync PR

# Triggers the CodeBuild project that validates and merges the daily
# botocore-sync PR. Gated so it only ever fires for the sagemaker-bot user, a
# `botocore-sync*` head branch, and the "Daily Sync with Botocore" title, and
# only when the PR touches the checked-in service models.
#
# NOTE: The CodeBuild project `sagemaker-core-merge-botocore-pr` is provisioned
# separately (deferred account-side setup). It reuses the repo's existing
# `CI_AWS_ROLE_ARN` OIDC role (same role every other CI workflow uses); that
# role must be granted codebuild:StartBuild on this project. The AI
# semantic-diff merge gate will be added as an extension of that CodeBuild step
# in the deferred phase.

on:
  pull_request:
    branches:
      - "master"
    paths:
      - "sagemaker-core/sample/**/*.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for requesting the OIDC JWT
  contents: read

jobs:
  merge-botocore-sync-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'sagemaker-bot' && startsWith(github.event.pull_request.head.ref, 'botocore-sync') && startsWith(github.event.pull_request.title, 'Daily Sync with Botocore')
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: us-west-2

      - name: Auto Merge Botocore Sync PRs
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: sagemaker-core-merge-botocore-pr
          env-vars-for-codebuild: |
            PR_NUMBER,
            COMMIT_SHA
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
