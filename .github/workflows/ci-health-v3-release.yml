name: CI Health V3 Release
on:
  schedule:
    # Once a day at 10:00 UTC (2am PDT / 3am PST).
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
    id-token: write # This is required for requesting the JWT

# Credentials are requested for 6h (the GithubActionsRole max session duration)
# so the aws-codebuild-run-build step can keep polling for the whole build. The
# canary CodeBuild timeout is set just under this (5.5h in CDK) so a hung build
# is recorded by CodeBuild as TIMED_OUT (counted in FailedBuilds) instead of the
# GitHub job being cancelled first.
jobs:
  # Per-submodule integ canaries against the published PyPI release. These also
  # cover the us-west-2 gpu_intensive tests (train, serve).
  canaries-v3-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        submodule: [sagemaker-core, sagemaker-train, sagemaker-serve, sagemaker-mlops]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 21600
      - name: Run Canaries V3 release for ${{ matrix.submodule }}
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: sagemaker-python-sdk-ci-health-canaries-v3-release
          source-version-override: refs/heads/master
          env-vars-for-codebuild: |
            SUBMODULE
        env:
          SUBMODULE: ${{ matrix.submodule }}
  # us_east_1-marked GPU integ tests against the published PyPI release. These
  # run in the separate us-east-1 (Nova) account, so they cannot be part of the
  # us-west-2 canaries. Their result is reported to us-west-2 by report-result.
  gpu-integ-tests-release-us-east-1:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (us-east-1)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_US_EAST_1_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 21600
      - name: Run GPU Integ Tests (release, us-east-1)
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: sagemaker-python-sdk-ci-health-gpu-integ-tests-release
          source-version: refs/heads/master
  # Run-level result for the us-east-1 GPU job. Its CodeBuild FailedBuilds metric
  # lives in the us-east-1 account, which the us-west-2 CIHealthCompositeAlarm-V3
  # cannot see, so the result is re-emitted to us-west-2 as
  # GpuIntegReleaseRunFailure = 1 (failed) / 0 (succeeded). The CDK alarm
  # (GpuIntegReleaseRunAlarm) sums this over a UTC day; it is folded into
  # CIHealthCompositeAlarm-V3, which owns ticketing. Only scheduled runs emit the
  # metric (manual workflow_dispatch runs are excluded).
  report-result:
    needs: [gpu-integ-tests-release-us-east-1]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MONITORING_ROLE_ARN }}
          aws-region: us-west-2
      - name: Emit run-level pass/fail metric
        run: |
          # Manual (workflow_dispatch) runs must not contribute to the daily
          # GpuIntegReleaseRunFailure count that drives GpuIntegReleaseRunAlarm;
          # only scheduled runs count.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Not a scheduled run (${{ github.event_name }}); skipping metric emission."
            exit 0
          fi
          if [ "${{ needs.gpu-integ-tests-release-us-east-1.result }}" == "success" ]; then
            value=0
            echo "us-east-1 release GPU job succeeded; emitting GpuIntegReleaseRunFailure=0"
          else
            value=1
            echo "us-east-1 release GPU job did not succeed; emitting GpuIntegReleaseRunFailure=1"
          fi
          aws cloudwatch put-metric-data \
            --namespace GpuIntegRunMetrics \
            --metric-name GpuIntegReleaseRunFailure \
            --value "$value" \
            --unit Count
