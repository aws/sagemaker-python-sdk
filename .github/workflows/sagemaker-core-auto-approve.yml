name: SageMaker Core - Auto Approve Botocore Sync PR

# Auto-approves the daily botocore-sync PR, but ONLY when it is opened by the
# sagemaker-bot user and explicitly carries the `auto-approve` label. This is
# intentionally narrow so it can never approve human-authored PRs.

on:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, review_requested]

jobs:
  auto-approve:
    if: contains(github.event.pull_request.labels.*.name, 'auto-approve') && github.event.pull_request.user.login == 'sagemaker-bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
